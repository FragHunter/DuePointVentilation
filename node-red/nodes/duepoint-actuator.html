<script type="text/html" data-help-name="duepoint-actuator">
  <p>Maps fresh logical DuePoint controller commands to the three physical fan targets and the coupled dual-T-diverter route.</p>
  <p>The node independently holds all fans OFF while the route is moving. If servo_travel_ms is not calibrated, it remains fail-safe with all fans OFF.</p>
  <p>It also rejects expired commands and sequence regressions before physical actuation.</p>
</script>
