name: Control tests

on:
  push:
    paths:
      - "src/control/**"
      - "test/**"
      - "config/**"
      - "package.json"
      - "node-red/**"
      - ".github/workflows/control-tests.yml"
  pull_request:
    paths:
      - "src/control/**"
      - "test/**"
      - "config/**"
      - "package.json"
      - "node-red/**"
      - ".github/workflows/control-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - run: node --check node-red/nodes/duepoint-control.cjs
